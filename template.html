<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #e3e5e8;
  --side: #fafafa; --accent: #2f81c7; --accent-bg: #e8f2fb;
  --code-bg: #1e1e1e; --inline-code: #eef0f2;
  --note: #f4f6f8; --warn: #fff6e0; --warn-line: #e0a100;
  --info: #eaf3fb; --local: #e9f7ee; --local-line: #2e9d5b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --fg: #dfe2e6; --muted: #9aa2ab; --line: #2c3036;
    --side: #1a1d21; --accent: #6cb2ee; --accent-bg: #1d3247;
    --code-bg: #0d0e10; --inline-code: #272b30;
    --note: #1e2227; --warn: #33290f; --info: #172a3a; --local: #14291d;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--accent); }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--side); border-right: 1px solid var(--line); padding: 0 0 24px;
}
.toc-head {
  position: sticky; top: 0; background: var(--side);
  display: flex; justify-content: space-between;
  padding: 16px 20px 10px; font-size: 13px; font-weight: 600;
  letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line);
}
.progress { height: 2px; background: var(--accent); width: 0; position: sticky; top: 46px; }
nav a {
  display: block; padding: 7px 20px; color: var(--fg); text-decoration: none;
  font-size: 15px; border-left: 3px solid transparent;
}
nav a.l3 { padding-left: 34px; color: var(--muted); }
nav a:hover { background: var(--accent-bg); }
nav a.current { background: var(--accent-bg); border-left-color: var(--accent); color: var(--fg); }
main { max-width: 900px; padding: 32px 40px 120px; min-width: 0; }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 4px; }
.byline { color: var(--muted); margin: 0 0 28px; }
h2 { font-size: 27px; margin: 56px 0 12px; padding-top: 20px; border-top: 1px solid var(--line); }
h3 { font-size: 21px; margin: 36px 0 8px; }
h4 { font-size: 17px; margin: 28px 0 6px; }
.headerlink { margin-left: 8px; text-decoration: none; color: var(--muted); opacity: 0; }
:is(h2, h3, h4):hover .headerlink, .headerlink:focus-visible { opacity: 1; }
hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
code {
  font: 0.86em/1.5 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
  background: var(--inline-code); padding: 2px 5px; border-radius: 4px;
}
kbd {
  font: 0.82em ui-monospace, monospace; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px;
}
blockquote { margin: 16px 0; padding: 2px 16px; border-left: 3px solid var(--line); color: var(--muted); }
figure { margin: 24px 0; text-align: center; }
figure img { max-width: 100%; height: auto; background: #fff; border-radius: 6px; }
figcaption { color: var(--muted); font-size: 14px; margin-top: 6px; }

.code { position: relative; margin: 14px 0; border-radius: 6px; background: var(--code-bg); overflow: hidden; }
.code + .code { margin-top: -6px; }
.code pre {
  margin: 0; padding: 14px 18px; overflow-x: auto; color: #e6e6e6;
  font: 14px/1.55 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
}
.code .hl { background: transparent; }
.code.cmd { border-left: 3px solid var(--local-line); }
.code.out pre { color: #b9bec5; font-size: 13px; }
.code .hll { display: block; margin: 0 -18px; padding: 0 18px; background: rgba(255, 214, 102, .14); }
.code-title {
  padding: 6px 18px; font: 12px ui-monospace, monospace; color: #9aa2ab;
  border-bottom: 1px solid #333;
}
.copy {
  position: absolute; top: 8px; right: 8px; border: 1px solid #555; border-radius: 4px;
  background: #2b2b2b; color: #ccc; font: 12px system-ui, sans-serif; padding: 3px 9px;
  cursor: pointer; opacity: 0; transition: opacity .12s;
}
.code:hover .copy, .copy:focus-visible { opacity: 1; }
.copy.done { color: #7ee2a0; border-color: #7ee2a0; }

.box { margin: 18px 0; border-radius: 6px; padding: 12px 18px; background: var(--note); border-left: 3px solid var(--line); }
.box > :last-child, .box-body > :last-child { margin-bottom: 0; }
.box p:first-of-type { margin-top: 4px; }
.box-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.box.warning { background: var(--warn); border-left-color: var(--warn-line); }
.box.info { background: var(--info); border-left-color: var(--accent); }
.box.local { background: var(--local); border-left-color: var(--local-line); }
.box.local .box-label { color: var(--local-line); }
details.box summary { cursor: pointer; font-weight: 600; }
details.box[open] summary { margin-bottom: 8px; }

.tabs { margin: 18px 0; border: 1px solid var(--line); border-radius: 6px; }
.tab-bar { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--side); border-radius: 6px 6px 0 0; }
.tab {
  border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px;
  padding: 9px 16px; cursor: pointer; border-bottom: 2px solid transparent;
}
.tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.tab-panel { display: none; padding: 4px 18px 8px; }
.tab-panel.active { display: block; }
.footnote { font-size: 14px; color: var(--muted); }

@media (max-width: 860px) {
  .layout { display: block; }
  nav { position: static; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 20px 16px 80px; }
}
{{pygments}}
</style>
</head>
<body>
<div class="layout">
<nav>
  <div class="toc-head"><span>TABLE OF CONTENTS</span><span id="pct">0%</span></div>
  <div class="progress" id="bar"></div>
{{toc}}
</nav>
<main>
<h1>{{title}}</h1>
<p class="byline">Tutorial by Antoine Cotten &middot; local copy</p>
{{content}}
</main>
</div>
<script>
document.querySelectorAll('.tabs').forEach(tabs => {
  const buttons = tabs.querySelectorAll(':scope > .tab-bar > .tab');
  const panels = tabs.querySelectorAll(':scope > .tab-panel');
  buttons.forEach((button, n) => button.addEventListener('click', () => {
    buttons.forEach((b, m) => b.classList.toggle('active', m === n));
    panels.forEach((p, m) => p.classList.toggle('active', m === n));
  }));
});

document.querySelectorAll('.copy').forEach(button => button.addEventListener('click', async () => {
  const text = button.parentElement.querySelector('pre').innerText.replace(/\n$/, '');
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = 'copied';
    button.classList.add('done');
    setTimeout(() => { button.textContent = 'copy'; button.classList.remove('done'); }, 1200);
  } catch (e) {
    button.textContent = 'select manually';
  }
}));

const links = [...document.querySelectorAll('nav a')];
const heads = links.map(a => document.getElementById(decodeURIComponent(a.hash.slice(1))));
const pct = document.getElementById('pct'), bar = document.getElementById('bar');
function spy() {
  let current = 0;
  heads.forEach((h, n) => { if (h && h.getBoundingClientRect().top < 120) current = n; });
  links.forEach((a, n) => a.classList.toggle('current', n === current));
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.round(scrollY / max * 100) : 0;
  pct.textContent = p + '%';
  bar.style.width = p + '%';
}
addEventListener('scroll', spy, { passive: true });
spy();
</script>
</body>
</html>
